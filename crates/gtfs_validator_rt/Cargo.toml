[package]
name = "gtfs-guru-rt"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0 AND CC-BY-3.0"
description = "GTFS-Realtime validation for GTFS Guru"
repository = "https://github.com/abasis-ltd/gtfs.guru"
homepage = "https://github.com/abasis-ltd/gtfs.guru"
readme = "README.md"
keywords = ["gtfs", "gtfs-realtime", "transit", "validator", "protobuf"]
categories = ["parsing"]

# The vendored schema and its provenance are build inputs, so they must ship in
# the published package; `cargo package` would otherwise omit the non-source
# files and the build script would fail on a fresh download.
include = [
  "proto/java-0.0.4/gtfs-realtime.proto",
  "proto/java-0.0.4/UPSTREAM.md",
  "proto/gtfs-realtime.proto",
  "proto/UPSTREAM.md",
  "src/**/*.rs",
  "tests/**/*.rs",
  "build.rs",
  "spec_baseline.json",
  "LICENSE-APACHE",
  "LICENSE-CC-BY-3.0",
  "README.md",
  "rt_notice_metadata.json"
]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
prost = "0.14.4"
prost-reflect = "0.16.5"
rustc-hash = "2.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tracing = { workspace = true }

[dependencies.gtfs-guru-core]
path = "../gtfs_validator_core"
version = "1.0.0"
default-features = false

[dependencies.gtfs-guru-model]
path = "../gtfs_model"
version = "1.0.0"

[build-dependencies]
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.9.1"

[features]
default = ["parallel"]
parallel = ["gtfs-guru-core/parallel"]

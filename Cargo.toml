[workspace]
members = [
  "crates/gtfs_model",
  "crates/gtfs_validator_core",
  "crates/gtfs_validator_report",
  "crates/gtfs_validator_profile",
  "crates/gtfs_validator_cli",
  "crates/gtfs_validator_mcp",
  "crates/gtfs_validator_web",
  "crates/gtfs_validator_gui",
  "crates/gtfs_validator_python",
  "crates/gtfs_validator_wasm",
]
# A bare `cargo build`/`cargo test` skips the Tauri desktop crate: it pulls the
# whole webkit2gtk tree and leaves ~4 GB of debug artifacts behind, which is a
# poor trade for a routine edit-test loop. CI and the pre-PR `--all`/`--workspace`
# runs still cover it; build it directly with `-p gtfs-guru-gui`.
default-members = [
  "crates/gtfs_model",
  "crates/gtfs_validator_core",
  "crates/gtfs_validator_report",
  "crates/gtfs_validator_profile",
  "crates/gtfs_validator_cli",
  "crates/gtfs_validator_mcp",
  "crates/gtfs_validator_web",
  "crates/gtfs_validator_python",
  "crates/gtfs_validator_wasm",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
csv = "1.3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
regex = "1.10"
base64 = "0.22"
url = "2.5"
schemars = "1.0"
axum = "0.7"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "fs", "signal"] }
tower = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

# Dev builds keep line tables for the workspace's own crates -- enough for
# file:line in panics and backtraces -- and carry no debug info for anything
# else. DWARF is over 99% of a full debug artifact here, and nobody steps into
# webkit2gtk or tokio, so the rest is disk and link time for no one's benefit.
# The all-features debug tree otherwise approaches the CI runner's free space.
[profile.dev]
debug = "line-tables-only"

# Dependencies: no debug info at all. `test` inherits `dev`, so this covers
# `cargo test` too.
[profile.dev.package."*"]
debug = 0

# Build scripts and proc macros are never debugged interactively either.
[profile.dev.build-override]
debug = 0

# Release profile tuned for CLI speed; use release-wasm for size.
# Shipped binaries carry no debug info: on Linux the DWARF is embedded in the
# ELF, which inflates every published tarball for no user benefit.
[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
debug = false
strip = "symbols"

# Same codegen as release, but keeps the symbols a flamegraph needs.
# Build with: cargo build --profile profiling -p gtfs-guru
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# WASM profile optimized for minimal binary size.
[profile.release-wasm]
inherits = "release"
lto = true
opt-level = 'z'
strip = true
